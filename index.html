    <script>
      // Mirrors src/lib/theme.tsx and src/lib/themes.ts so the right theme paints before React loads.
      (function () {
        var bg = { "matte-black": "#121212",
          "tokyo-night": "#1a1b26",
          "hackerman": "#0b0c16",
          "lumon": "#16242d",
          "retro-82": "#05182e",
          "ristretto": "#2c2525",
          "osaka-jade": "#111c18",
          "lupine": "#fafafa",
          "rose-pine": "#faf4ed",
          "flexoki": "#fffcf0" };
        var t;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t === "dark") t = "matte-black";
        if (t === "light") t = "flexoki";
        if (!bg[t]) t = matchMedia("(prefers-color-scheme: light)").matches ? "flexoki" : "matte-black";
        document.documentElement.dataset.theme = t;
        document.querySelector('meta[name="theme-color"]').content = bg[t];
      })();
    </script>
